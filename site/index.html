<script>
(()=>{'use strict';
const KEY='pharma-job-tracker-v1';
const STANDARD=['网申','测评','AI面','一面','二面','三面','谈薪','Offer','三方'];
const COMPANY_HINTS=['药明康德','药明生物','药明合联','药明巨诺','药明奥测','药明海德','药明明码','药明津石','药明博锐','恒瑞医药','百济神州','信达生物','君实生物','复星医药','华东医药','石药集团','中国生物制药','翰森制药','正大天晴','齐鲁制药','扬子江药业','康方生物','荣昌生物','再鼎医药','康龙化成','泰格医药','凯莱英','先声药业','科伦药业','华润三九'];
const $=s=>document.querySelector(s),$$=(s,root=document)=>[...root.querySelectorAll(s)];
let records=[],activeStatus='all',pendingFormStage='',previousFormStage='',cardContext=null,legacyData={},month=new Date(),selectedCalendarDate='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const today=()=>localDate();
function normalize(r){const status=['closed','rejected'].includes(r.status)?'closed':'active';const stage=r.stage||'网申';let custom=Array.isArray(r.customStages)?r.customStages:[];custom=custom.map(x=>typeof x==='string'?{name:x,date:''}:{name:x.name||x.stage||'',date:(x.date||'').slice(0,10)}).filter(x=>x.name);let history=Array.isArray(r.history)?r.history.map(x=>({stage:x.stage||x.name||stage,date:String(x.date||x.at||r.date||today()).slice(0,10)})):[];if(!history.length&&r.date)history=[{stage:stage,date:r.date}];if(!r.historyDateFixed&&history.length&&history[0].stage==='网申'&&r.date)history[0].date=r.date;return {...r,status,stage,pipelineMode:r.pipelineMode==='custom'?'custom':'standard',customStages:custom,history,historyDateFixed:true,method:r.method||r.deliveryMethod||'',methodOther:r.methodOther||'',url:r.url||'',type:['校招','社招','实习'].includes(r.type)?r.type:'校招',date:r.date||today()}}
function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'{}');records=Array.isArray(data.records)?data.records.map(normalize):[];legacyData={companies:Array.isArray(data.companies)?data.companies:[],review:data.review||''};if(records.length)localStorage.setItem(KEY,JSON.stringify({...legacyData,version:4,records}))}catch{records=[];legacyData={}}}
function save(){localStorage.setItem(KEY,JSON.stringify({...legacyData,version:4,records}))}
function stageList(r){const a=r.pipelineMode==='custom'?r.customStages.map(x=>x.name):STANDARD;const s=[...a];if(r.stage&&!s.includes(r.stage))s.push(r.stage);return s.length?s:STANDARD}
function historyDate(r,name){const h=[...(r.history||[])].reverse().find(x=>x.stage===name);const c=(r.customStages||[]).find(x=>x.name===name);return c?.date||h?.date||''}
function showDate(s){if(!s)return '';const [y,m,d]=s.slice(0,10).split('-');return y&&m&&d?`${y}-${m}-${d}`:s}
function isOffer(r){return /^(offer|三方)$/i.test(r.stage||'')}
function isInterview(r){return /面|谈薪/.test(r.stage||'')}
function renderStats(){const $total=$('#totalCount'),$interview=$('#interviewCount'),$offer=$('#offerCount'),$closed=$('#closedCount');$total.textContent=records.length;$interview.textContent=records.filter(r=>r.status==='active'&&isInterview(r)).length;$offer.textContent=records.filter(isOffer).length;$closed.textContent=records.filter(r=>r.status==='closed').length;renderDistribution()}
function renderDistribution(){const rows=[['进行中',records.filter(r=>r.status==='active').length],['已结束',records.filter(r=>r.status==='closed').length],['Offer / 三方',records.filter(isOffer).length]];$('#distribution').innerHTML=rows.map(([label,count])=>`<div class="dist-row"><span>${label}</span><div class="bar-bg"><div class="bar" style="width:${records.length?Math.max(100*count/records.length,count?3:0):0}%"></div></div><strong>${count}</strong></div>`).join('')}
function stagesHtml(r){const stages=stageList(r),cur=Math.max(0,stages.indexOf(r.stage));return `<div class="stage-track">${stages.map((name,i)=>{const date=historyDate(r,name),ended=r.status==='closed'&&i===cur;return `${i?'<span class="stage-arrow" aria-hidden="true"></span>':''}<div class="stage ${i<cur?'done':i===cur?'current':''}${ended?' ended':''}" title="${esc(name)}${date?' · '+esc(showDate(date)):''}${ended?' · 已结束':''}"><div class="stage-dot">${i<=cur?'✓':'○'}</div><span>${esc(name)}</span>${date?`<small>${esc(showDate(date))}</small>`:''}</div>`}).join('')}</div>`}
function timelineHtml(r){const history=r.history||[];if(!history.length)return '';return `<details class="history"><summary>推进时间线（${history.length}）</summary><div class="history-list">${[...history].reverse().map(x=>`<div class="history-item"><span class="history-point"></span><span><b>${esc(x.stage)}</b><small>${esc(showDate(x.date))}</small></span></div>`).join('')}</div></details>`}
function nextStage(r){const a=stageList(r),i=a.indexOf(r.stage);return i>=0&&i<a.length-1?a[i+1]:''}
function cardHtml(r){const href=/^https?:\/\//i.test(r.url||'');const n=(r.company||'?').codePointAt(0)||0;const nature=r.companyNature||'私企';const nc=nature==='国企'?'state':nature==='外企'?'foreign':nature==='中外合资'?'jv':'';return '<article class="record" data-record="'+esc(r.id)+'"><div class="card-identity"><div class="company-mark" style="background:'+['#fff0ed','#e8edff','#fceafb','#e3f8ef','#fff2dd','#eae7ff'][n%6]+'">'+esc((r.company||'?').slice(0,1))+'</div><div class="record-info"><div class="company-title">'+esc(r.company)+'<span class="nature-chip '+nc+'">'+esc(nature)+'</span></div><div class="job">'+esc(r.role)+'</div><div class="card-meta"><span>'+esc(r.method==='其他'?(r.methodOther||'其他'):r.method||'未填写投递方式')+'</span>'+(href?'<a class="card-site" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer" title="打开招聘官网"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></a>':'')+'</div></div></div><div class="card-tools"><div class="card-date">◷ '+esc(showDate(r.date))+' 投递</div><div class="card-buttons"><button class="edit-card" data-action="edit" data-id="'+esc(r.id)+'" title="编辑记录" aria-label="编辑记录">✎</button><div class="menu-wrap"><button class="dots" data-menu-toggle="'+esc(r.id)+'" title="更多操作">•••</button><div class="menu" data-menu="'+esc(r.id)+'" hidden>'+(r.status==='closed'?'<button data-action="reopen" data-id="'+esc(r.id)+'">重新设为进行中</button>':'<button data-action="end" data-id="'+esc(r.id)+'">标记为已结束</button>')+'<button data-action="advance" data-id="'+esc(r.id)+'" '+(r.status==='closed'||!nextStage(r)?'disabled':'')+'>流转至下一步'+(nextStage(r)?'：'+esc(nextStage(r)):'（已到最后一步）')+'</button><button data-action="edit" data-id="'+esc(r.id)+'">编辑记录</button><button class="danger" data-action="delete" data-id="'+esc(r.id)+'">删除记录</button></div></div></div></div><section class="record-progress"><div class="progress-heading"><span>招聘进度</span><span class="pill '+(r.status==='closed'?'closed':'active')+'">'+(r.status==='closed'?'已结束':'进行中')+'</span></div>'+stagesHtml(r)+timelineHtml(r)+'</section></article>'}
function renderRecords(){const q=($('#filterSearch').value||$('#globalSearch').value||'').trim().toLowerCase(),type=$('#typeFilter').value,status=$('#statusFilter').value;const shown=records.filter(r=>{const text=[r.company,r.role,r.notes,r.method,r.methodOther,r.url,r.type].join(' ').toLowerCase();return(!q||text.includes(q))&&(activeStatus==='all'||r.status===activeStatus)&&(status==='all'||r.status===status)&&(type==='all'||r.type===type)}).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('#recordCount').textContent=`共 ${shown.length} 条记录`;$('#recordList').innerHTML=shown.map(cardHtml).join('')||`<div class="empty"><strong>${records.length?'没有符合条件的记录':'开始记录第一份投递'}</strong>${records.length?'请调整搜索词或筛选条件。':'添加公司、岗位和招聘进度。'}<div style="margin-top:14px"><button class="btn primary" id="emptyAdd">＋ 添加投递</button></div></div>`;$('#emptyAdd')?.addEventListener('click',()=>openRecord())}
function recordEventsOn(date){const events=[];records.forEach(r=>{if(r.date===date)events.push(`${r.company} · 投递`);(r.history||[]).filter(x=>x.date===date).forEach(x=>events.push(`${r.company} · ${x.stage}`));(r.customStages||[]).filter(x=>x.date===date&&!(r.history||[]).some(h=>h.stage===x.name&&h.date===date)).forEach(x=>events.push(`${r.company} · ${x.name}`))});return events}
function renderCalendar(){if(!selectedCalendarDate)selectedCalendarDate=today();const y=month.getFullYear(),m=month.getMonth(),last=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;$('#monthLabel').textContent=`${y} 年 ${m+1} 月`;const days=[];for(let i=0;i<42;i++){const d=new Date(y,m,i-offset+1),iso=localDate(d);days.push({d,iso})}const labels=['一','二','三','四','五','六','日'];$('#miniCalendar').innerHTML=`<div class="calendar-grid">${labels.map(x=>`<div class="weekday">${x}</div>`).join('')}${days.map(({d,iso})=>{const active=d.getMonth()===m,has=recordEventsOn(iso).length>0;return `<button class="day ${active?'':'other'} ${iso===today()?'today':''} ${iso===selectedCalendarDate?'selected':''} ${has?'has-event':''}" data-day="${iso}">${d.getDate()}</button>`}).join('')}</div>`;$$('[data-day]').forEach(b=>b.onclick=()=>{selectedCalendarDate=b.dataset.day;const items=recordEventsOn(selectedCalendarDate);$('#calendarNote').textContent=items.length?`${selectedCalendarDate} · ${items.length} 项事项`:`${selectedCalendarDate} 暂无事项`;renderCalendar();if(items.length)toast(items.join('；'))});if(!selectedCalendarDate)selectedCalendarDate=today();const initial=recordEventsOn(selectedCalendarDate);$('#calendarNote').textContent=initial.length?`${selectedCalendarDate} · ${initial.length} 项事项`:`${selectedCalendarDate} 暂无事项`}
function render(){renderStats();renderRecords();renderCalendar()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function companyOptions(){const map=new Map(COMPANY_HINTS.map(n=>[n,0]));records.map(r=>r.company).filter(Boolean).forEach(n=>map.set(n,(map.get(n)||0)+1));return [...map].map(([label,count])=>({label,count}))}
function roleOptions(){const map=new Map();records.map(r=>r.role).filter(Boolean).forEach(n=>map.set(n,(map.get(n)||0)+1));return [...map].map(([label,count])=>({label,count}))}
function suggestions(input,box,items,select){const q=input.value.trim().toLowerCase();if(!q){box.hidden=true;return}const hits=items.filter(x=>x.label.toLowerCase().includes(q)).sort((a,b)=>(Number(b.label.toLowerCase().startsWith(q))-Number(a.label.toLowerCase().startsWith(q)))||b.count-a.count||a.label.localeCompare(b.label,'zh-CN')).slice(0,7);box.innerHTML=hits.map((x,i)=>`<button type="button" class="suggestion" data-index="${i}">${esc(x.label)}${x.count>1?`<small>使用过 ${x.count} 次</small>`:''}</button>`).join('');box.hidden=!hits.length;$$('.suggestion',box).forEach(b=>b.onclick=()=>{select(hits[Number(b.dataset.index)].label);box.hidden=true})}
function addCustomRow(name='',date=''){const row=document.createElement('div');row.className='custom-row';row.innerHTML=`<input data-stage-name placeholder="流程名称，例如：HR 面" value="${esc(name)}"><input data-stage-date type="date" value="${esc(date)}"><button class="remove-stage" type="button" title="删除此阶段">×</button>`;$('#customBuilder').append(row);row.querySelector('[data-stage-name]').oninput=()=>refreshStageFromCustom();row.querySelector('.remove-stage').onclick=()=>{row.remove();refreshStageFromCustom()}}
function readCustom(){return $$('.custom-row').map(x=>({name:x.querySelector('[data-stage-name]').value.trim(),date:x.querySelector('[data-stage-date]').value})).filter(x=>x.name)}
function formStages(){return $('#recordForm').elements.pipelineMode.value==='custom'?readCustom().map(x=>x.name):STANDARD}
function refreshStageSelect(want){const select=$('#stageSelect'),old=want||select.value,stages=formStages();select.innerHTML=stages.map(x=>`<option>${esc(x)}</option>`).join('');if(stages.includes(old))select.value=old;else if(stages.length)select.value=stages[0];return select.value}
function refreshStageFromCustom(){const f=$('#recordForm'),prev=f.dataset.currentStage,selected=refreshStageSelect(prev);if(f.elements.id.value&&selected&&selected!==prev)openProgressDate(selected,prev)}
function setPipelineMode(mode,record){const custom=mode==='custom';$('#customStagesWrap').classList.toggle('hidden',!custom);if(custom&&!$('#customBuilder').children.length){const old=record?.customStages||[];if(old.length)old.forEach(x=>addCustomRow(x.name,x.date));else{const current=record?.stage||$('#stageSelect').value||'网申';addCustomRow(current,record?historyDate(record,current):($('#recordForm').elements.date.value||today()))}}if(!custom)$('#customBuilder').innerHTML='';return refreshStageSelect(record?.stage)}
function updateCustomStageDate(name,date){if($('#recordForm').elements.pipelineMode.value!=='custom')return;const row=$$('.custom-row').find(x=>x.querySelector('[data-stage-name]').value.trim()===name);if(row)row.querySelector('[data-stage-date]').value=date}
function openProgressDate(stage,prev){pendingFormStage=stage;previousFormStage=prev;$('#progressPrompt').textContent=`请选择进入“${stage}”的日期。`;$('#progressDateInput').value=today();$('#progressDateModal').classList.add('open')}
function cancelProgressDate(){if(cardContext){cardContext=null}else{$('#stageSelect').value=previousFormStage;$('#recordForm').elements.progressDate.value=$('#recordForm').dataset.progressDate||''}$('#progressDateModal').classList.remove('open')}
function confirmProgressDate(){const date=$('#progressDateInput').value;if(!date){toast('请选择流程推进日期');return}if(cardContext){const r=records.find(x=>x.id===cardContext.id);if(r){r.stage=pendingFormStage;r.history=[...(r.history||[]),{stage:pendingFormStage,date}];if(r.pipelineMode==='custom'){const row=r.customStages.find(x=>x.name===pendingFormStage);if(row)row.date=date}save();render();toast(`已记录进入“${pendingFormStage}”的日期`)}cardContext=null}else{const f=$('#recordForm');f.elements.progressDate.value=date;f.dataset.progressDate=date;f.dataset.currentStage=pendingFormStage;$('#stageSelect').value=pendingFormStage;updateCustomStageDate(pendingFormStage,date)}$('#progressDateModal').classList.remove('open')}
function openRecord(r){const f=$('#recordForm');f.reset();f.elements.companyNature.value=r?.companyNature||'私企';f.elements.id.value=r?.id||'';f.elements.date.value=r?.date||today();f.elements.type.value=r?.type||'校招';f.elements.method.value=r?.method||'';f.elements.methodOther.value=r?.methodOther||'';f.elements.status.value=r?.status||'active';f.elements.pipelineMode.value=r?.pipelineMode||'standard';$('#methodOther').classList.toggle('hidden',f.elements.method.value!=='其他');$('#customBuilder').innerHTML='';setPipelineMode(f.elements.pipelineMode.value,r);const stage=refreshStageSelect(r?.stage||'网申');const savedDate=r?(r.history||[]).slice().reverse().find(x=>x.stage===stage)?.date||r.date: f.elements.date.value;f.elements.progressDate.value=savedDate;f.dataset.progressDate=savedDate;f.dataset.currentStage=stage;for(const k of ['company','role','url','notes'])f.elements[k].value=r?.[k]||'';$('#modalTitle').textContent=r?'编辑投递':'添加投递';$('#recordModal').classList.add('open')}
function showRecordModal(show){$('#recordModal').classList.toggle('open',show)}
function removeRecord(id){if(!confirm('确定删除这条投递记录吗？'))return;records=records.filter(r=>r.id!==id);save();render();toast('投递记录已删除')}
function exportData(){const data={...legacyData,version:3,exportedAt:new Date().toISOString(),records};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`求职投递备份-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('个人数据备份已导出')}
function advanceRecord(id){const r=records.find(x=>x.id===id),next=r&&nextStage(r);if(!r||r.status==='closed'||!next)return;cardContext={id};openProgressDate(next,'')}
function closeMenus(){$$('.menu').forEach(x=>x.hidden=true)}
$('#addBtn').onclick=()=>openRecord();$('#exportBtn').onclick=exportData;$('#todayBtn').onclick=()=>{const date=$('#recordForm').elements.date;date.value=today();if(!$('#recordForm').elements.id.value){$('#recordForm').elements.progressDate.value=today();const row=$$('.custom-row')[0];if(row)row.querySelector('[data-stage-date]').value=today()}};
$('#recordForm').elements.date.onchange=()=>{if(!$('#recordForm').elements.id.value&&$('#recordForm').elements.stage.value==='网申'){$('#recordForm').elements.progressDate.value=$('#recordForm').elements.date.value;const first=$$('.custom-row')[0];if(first&&first.querySelector('[data-stage-name]').value.trim()==='网申')first.querySelector('[data-stage-date]').value=$('#recordForm').elements.date.value}};
$('#recordForm').elements.method.onchange=e=>$('#methodOther').classList.toggle('hidden',e.target.value!=='其他');$('#recordForm').elements.pipelineMode.onchange=e=>{const f=$('#recordForm'),prev=f.dataset.currentStage,selected=setPipelineMode(e.target.value);if(f.elements.id.value&&selected&&selected!==prev)openProgressDate(selected,prev)};$('#addStageBtn').onclick=()=>{addCustomRow('',today());refreshStageSelect($('#stageSelect').value)};
$('#stageSelect').onchange=e=>{const f=$('#recordForm'),prev=f.dataset.currentStage||e.target.value;if(e.target.value!==prev)openProgressDate(e.target.value,prev)};
const ci=$('#recordForm').elements.company,ri=$('#recordForm').elements.role,cb=$('#companySuggestions'),rb=$('#roleSuggestions');ci.oninput=ci.onfocus=()=>suggestions(ci,cb,companyOptions(),v=>ci.value=v);ri.oninput=ri.onfocus=()=>suggestions(ri,rb,roleOptions(),v=>ri.value=v);document.addEventListener('click',e=>{if(!e.target.closest('.ac-wrap')){$$('.suggestions').forEach(x=>x.hidden=true)}if(!e.target.closest('.menu-wrap'))closeMenus()});
$$('[data-close]').forEach(b=>b.onclick=()=>showRecordModal(false));$('#cancelProgress').onclick=$('#cancelProgressX').onclick=cancelProgressDate;$('#confirmProgress').onclick=confirmProgressDate;
$('#recordForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f)),old=records.find(r=>r.id===d.id),stage=d.stage,custom=d.pipelineMode==='custom'?readCustom():[];if(d.pipelineMode==='custom'&&!custom.length){toast('请至少填写一个流程节点');return}if(custom.some(x=>!x.date)){toast('请为每个自定义流程节点选择日期');return}const appDate=d.date||today(),progressDate=d.progressDate||appDate,history=old?[...(old.history||[])]:[];if(old&&d.date!==old.date&&history.length&&history[0].stage==='网申')history[0]={...history[0],date:appDate};if(old&&old.stage!==stage){if(!progressDate){openProgressDate(stage,old.stage);return}history.push({stage,date:progressDate})}const customDate=custom.find(x=>x.name===stage)?.date;if(!old)history.push({stage,date:d.pipelineMode==='custom'?(customDate||progressDate):(stage==='网申'?appDate:progressDate)});if(d.pipelineMode==='custom')custom.forEach(c=>{const i=history.map(x=>x.stage).lastIndexOf(c.name);if(i>=0)history[i]={...history[i],date:c.date}});const rec={...old,id:d.id||crypto.randomUUID(),company:d.company.trim(),companyNature:d.companyNature||'私企',role:d.role.trim(),type:d.type,date:appDate,method:d.method,methodOther:d.method==='其他'?d.methodOther.trim():'',pipelineMode:d.pipelineMode,customStages:custom,stage,status:d.status==='closed'?'closed':'active',url:d.url.trim(),notes:d.notes.trim(),history,historyDateFixed:true};records=old?records.map(x=>x.id===rec.id?normalize(rec):x):[normalize(rec),...records];save();showRecordModal(false);render();toast(old?'投递记录已更新':'投递记录已保存')};
$('#recordList').onclick=e=>{const toggle=e.target.closest('[data-menu-toggle]');if(toggle){const menu=$$('.menu').find(x=>x.dataset.menu===toggle.dataset.menuToggle);const open=menu.hidden;closeMenus();menu.hidden=!open;return}const action=e.target.closest('[data-action]');if(!action)return;const id=action.dataset.id,r=records.find(x=>x.id===id);if(!r)return;closeMenus();switch(action.dataset.action){case'edit':openRecord(r);break;case'delete':removeRecord(id);break;case'end':r.status='closed';save();render();toast('已标记为已结束');break;case'reopen':r.status='active';save();render();toast('记录已重新设为进行中');break;case'advance':advanceRecord(id);break}};
$('#filterSearch').oninput=renderRecords;

$('#statusFilter').onchange=renderRecords;

$('#statusTabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;activeStatus=b.dataset.status;$$('#statusTabs .tab').forEach(x=>x.classList.toggle('active',x===b));renderRecords()};
$('#sideNav').onclick=e=>{const b=e.target.closest('[data-nav]');if(!b)return;const target=b.dataset.nav;$$('#sideNav [data-nav]').forEach(x=>x.classList.toggle('active',x===b));const anchors={overview:document.body,list:$('#listArea'),calendar:$('#calendarPanel'),analytics:$('#distributionPanel')};if(anchors[target])anchors[target].scrollIntoView({behavior:'smooth',block:target==='overview'?'start':'center'});else toast('此模块将在后续版本中开发')};
